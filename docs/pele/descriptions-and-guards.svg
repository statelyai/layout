<svg xmlns="http://www.w3.org/2000/svg" width="1205.5" height="1336" viewBox="0 0 1205.5 1336"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0L7,3.5L0,7Z" fill="#c8c7be"/></marker></defs><rect width="100%" height="100%" fill="#1c1c1a"/><path d="M 493 210 L 493 228.5" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 493 326.5 L 493 352" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 395 484 C 395 555 135 555 135 626 L 135 643" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 135 741 L 135 1174" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 591 484 C 591 493.25 685.5 493.25 685.5 502.5" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 685.5 600.5 L 685.5 626" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 583.5 758 L 583.5 776.5" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 583.5 874.5 L 583.5 900" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 783.5 758 C 783.5 829 1014 829 1014 900 L 1014 917" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 1014 1015 L 1014 1148.5 C 1014 1152.09 783.5 1159.26 783.5 1162.84 L 783.5 1174" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 485.5 1032 C 485.5 1038.02 258 1044.48 258 1050.5" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 258 1148.5 L 258 1174" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 583.5 1032 L 583.5 1050.5" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 583.5 1148.5 L 583.5 1174" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 681.5 1032 C 681.5 1038.53 891 1043.97 891 1050.5" fill="none" stroke="#c8c7be" stroke-width="1.4" /><path d="M 891 1148.5 C 891 1154.62 1025.5 1156.72 1025.5 1162.84 L 1025.5 1174" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 493 34 L 493 78" fill="none" stroke="#c8c7be" stroke-width="1.4" marker-end="url(#arrow)"/><g><rect x="343" y="78" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="355" y="83" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Queued</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Captures the current semantic graph revision. Waits for prior work on this editor to settle; a prior rejected task does not permanently block the queue.</div></div></foreignObject></g><g><rect x="343" y="352" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="355" y="357" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Checking request</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Checks cancellation/current request, editing mode, edit capability, strict input schema and unchanged document revision before starting conversion.</div></div></foreignObject></g><g><rect x="535.5" y="626" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="547.5" y="631" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Converting source</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Converts complete XState source using the current graph profile and extensions. Built-in XState input delegates to the conversion HTTP API.</div></div></foreignObject></g><g><rect x="433.5" y="900" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="445.5" y="905" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Checking result</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Repeats request/currentness, mode/capability and graph-revision checks after asynchronous conversion. Then checks graph integrity, modeling and profile validation before replacement.</div></div></foreignObject></g><g><rect x="42.5" y="1174" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="54.5" y="1179" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Rejected without applying</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Stale/cancelled requests, unavailable editing or malformed initial input return a rejection. A cancelled caller may already have returned while underlying queued work settles.</div></div></foreignObject></g><g><rect x="535.5" y="1174" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="547.5" y="1179" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Source or graph needs correction</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">A conversion or candidate-graph contract failure is reported as repairable after creation starts, with a retry-create hint.</div></div></foreignObject></g><g><rect x="875.5" y="1174" width="300" height="132" rx="9" fill="#282826" stroke="#464640" /><foreignObject x="887.5" y="1179" width="276" height="122"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">Applied</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Replaces the graph, emits replacement start, requests layout for all scopes and returns success with the new graph revision.</div></div></foreignObject></g><circle cx="493" cy="27" r="7" fill="#c8c7be"/><g><rect x="378" y="228.5" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" /><foreignObject x="390" y="233.5" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">queueReady</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Previous queued work has settled; execute this action.</div></div></foreignObject></g><g><rect x="20" y="643" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" stroke-dasharray="5 4"/><foreignObject x="32" y="648" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">IF preflightRejected</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">A preflight check throws before creation begins.</div></div></foreignObject></g><g><rect x="570.5" y="502.5" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" stroke-dasharray="5 4"/><foreignObject x="582.5" y="507.5" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">ELSE</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Preflight succeeds; mark creation as started and await conversion.</div></div></foreignObject></g><g><rect x="468.5" y="776.5" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" /><foreignObject x="480.5" y="781.5" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">conversionCompleted</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">A graph is returned; reassess the live editor before applying it.</div></div></foreignObject></g><g><rect x="899" y="917" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" /><foreignObject x="911" y="922" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">conversionFailed</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Conversion throws after creation starts; surface a repairable rejection.</div></div></foreignObject></g><g><rect x="143" y="1050.5" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" stroke-dasharray="5 4"/><foreignObject x="155" y="1055.5" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">IF requestObsoleteOrUnavailable</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">The request was cancelled/replaced, editing is unavailable or the semantic graph revision changed.</div></div></foreignObject></g><g><rect x="468.5" y="1050.5" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" stroke-dasharray="5 4"/><foreignObject x="480.5" y="1055.5" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">ELSE IF candidateRejected</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Request remains current but the candidate fails graph contract checks.</div></div></foreignObject></g><g><rect x="776" y="1050.5" width="230" height="98" rx="12" fill="#1c1c1a" stroke="#464640" stroke-dasharray="5 4"/><foreignObject x="788" y="1055.5" width="206" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;flex-direction:column;justify-content:center;color:#deddd4;font-family:Arial,sans-serif;font-size:14px;text-align:left;line-height:1.3"><div style="font-weight:600">ELSE</div><div style="font-size:12px;color:#b9b8af;margin-top:5px">Request and candidate checks pass; replace the graph and request layout.</div></div></foreignObject></g></svg>