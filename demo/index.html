<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Stately Layout Lab</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <strong>Layout Lab</strong>
            <span>@statelyai/layout</span>
          </div>
        </div>
        <div class="topbar-status" role="status">
          <span class="status-dot" data-status-dot></span>
          <span data-status>Geometry ready</span>
          <span class="status-detail" data-detail>Exact graph geometry</span>
        </div>
      </header>

      <div class="app-body">
        <nav class="scenario-browser" aria-label="Example graphs">
          <div class="scenario-browser-heading">
            <div>
              <strong>Examples</strong>
              <span><b data-count></b> layouts</span>
            </div>
            <label class="scenario-search">
              <span class="sr-only">Filter examples</span>
              <input type="search" data-search placeholder="Filter examples…" autocomplete="off" />
            </label>
          </div>
          <div class="scenario-list" data-scenarios></div>
          <p class="scenario-empty" data-empty hidden>No matching examples.</p>
          <div class="scenario-legend">
            <span><i class="swatch oracle"></i>ELK Live catalog · elkjs geometry</span>
          </div>
        </nav>

        <section class="workspace" aria-label="Layout viewer">
          <header class="workspace-heading">
            <div class="workspace-title">
              <div>
                <h1 data-name></h1>
                <span class="engine-badge" data-engine></span>
              </div>
              <p data-description></p>
            </div>
            <div class="workspace-actions">
              <div class="renderer-switch" role="tablist" aria-label="Renderer">
                <button type="button" role="tab" data-view="geometry">Geometry</button>
                <button type="button" role="tab" data-view="sdk">SDK view</button>
              </div>
              <div class="zoom-controls" data-zoom-controls aria-label="Canvas zoom">
                <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
                <button type="button" data-zoom="fit">Fit</button>
                <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
              </div>
            </div>
          </header>

          <div class="geometry-workspace" data-geometry-view>
            <div class="geometry-stage">
              <div class="geometry-canvas" data-geometry></div>
              <p class="canvas-help">Scroll to zoom · drag to pan</p>
            </div>
            <aside class="inspector" aria-label="Geometry inspector">
              <section class="inspector-selection" data-inspector aria-live="polite"></section>
              <fieldset class="overlay-controls" data-geometry-controls>
                <legend>Inspection overlays</legend>
                <label><input type="checkbox" data-option="grid" /> Measurement grid</label>
                <label><input type="checkbox" data-option="bounds" /> Container bounds</label>
                <label><input type="checkbox" data-option="labels" /> Edge label bounds</label>
                <label><input type="checkbox" data-option="points" /> Route points</label>
                <label><input type="checkbox" data-option="ports" checked /> Ports</label>
              </fieldset>
              <p class="inspector-note">
                The SVG reads the serialized <code>@statelyai/graph</code> coordinates directly. No
                renderer-side layout or routing.
              </p>
            </aside>
          </div>
          <div class="embed" data-embed hidden></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
